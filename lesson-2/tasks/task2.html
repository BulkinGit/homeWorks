<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../css/style.css">
  <title>Document</title>
</head>

<body>
  <div class="block">
    <h2>Задача 2</h2>
    <p>
      Задача 2. Дано рік народження (дата: 1 січня) та поточний рік. Знайти кількість років.
    </p>
    <script>
      // 1 вводимо дані
      const yearUser = parseInt(prompt("Введіть свій рік народження", "1995"))
      const year = 2026

      // 2 знаходимо результат 
      const ageUser = year - yearUser

      // 3 Виводимо результат
      document.write(`Ваш вік: ${ageUser}`)
    </script>
  </div>
</body>

</html>
